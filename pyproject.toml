[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitguard"
version = "0.1.0"
description = "Space debris conjunction assessment and collision-avoidance planning for satellite operators"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["space situational awareness", "space debris", "conjunction assessment", "orbital mechanics", "collision avoidance", "astrodynamics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
orbitguard = "orbitguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
